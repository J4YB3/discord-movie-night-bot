name: Repository Housekeeping

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    types: [closed]
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  stale:
    name: Mark inactive discussions as stale
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >-
            This issue has been inactive for 180 days and has been marked as stale.
            It will be closed after a further 180 days without activity.
          stale-pr-message: >-
            This pull request has been inactive for 180 days and has been marked as stale.
            It will be closed after a further 180 days without activity.
          close-issue-message: >-
            This issue has remained inactive for 180 days since being marked stale and is now closed.
            Open a new issue if further work is needed.
          close-pr-message: >-
            This pull request has remained inactive for 180 days since being marked stale and is now closed.
            Open a new pull request if further work is needed.
          days-before-stale: 180
          days-before-close: 180
          stale-issue-label: stale
          exempt-issue-labels: pinned,security,in-progress
          exempt-pr-labels: pinned,security,in-progress

  label:
    name: Label new and updated issues
    if: github.event_name == 'issues'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const labels = [
              { name: "type: bug", color: "d73a4a", description: "Defect or unexpected behavior" },
              { name: "type: enhancement", color: "a2eeef", description: "Feature or improvement request" },
              { name: "area: discord", color: "5319e7", description: "Discord integration" },
              { name: "area: tmdb", color: "fbca04", description: "TMDB and movie metadata" },
              { name: "area: persistence", color: "1d76db", description: "Stored data and persistence" },
              { name: "area: automation", color: "0e8a16", description: "CI and repository automation" },
              { name: "area: documentation", color: "0075ca", description: "Documentation" },
              { name: "triage: needs-review", color: "ededed", description: "Needs maintainer review" },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }

            const text = `${issue.title}\n${issue.body || ""}`;
            const escapeRegex = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const hasKeyword = (keyword) => {
              const escapedKeyword = escapeRegex(keyword);
              return new RegExp(
                `(?:^|[^\\p{L}\\p{N}_])${escapedKeyword}(?=$|[^\\p{L}\\p{N}_])`,
                "iu",
              ).test(text);
            };
            const keywordLabels = [
              { name: "type: bug", keywords: ["bug", "error", "fail", "panic", "crash"] },
              { name: "type: enhancement", keywords: ["feature", "request", "enhancement"] },
              { name: "area: discord", keywords: ["discord", "gateway", "reaction", "command"] },
              { name: "area: tmdb", keywords: ["tmdb", "movie", "poster"] },
              { name: "area: persistence", keywords: ["persistence", "json", "sqlite", "data"] },
              { name: "area: automation", keywords: ["ci", "github actions", "dependabot", "cargo"] },
              { name: "area: documentation", keywords: ["documentation", "readme", "docs"] },
            ];
            const matches = keywordLabels
              .filter(({ keywords }) => keywords.some(hasKeyword))
              .map(({ name }) => name);

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issue.number,
              labels: matches.length > 0 ? matches : ["triage: needs-review"],
            });


  pr-cache-cleanup:
    name: Remove closed pull request caches
    if: github.event_name == 'pull_request'
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete pull request caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh cache list --ref refs/pull/${PR_NUMBER}/merge --limit 100 --json id --jq '.[].id' | xargs -r -n 1 gh cache delete || true

  stale-cache-cleanup:
    name: Remove stale non-main caches
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches unused for 14 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate repos/${GH_REPO}/actions/caches?per_page=100 --jq --arg cutoff "${cutoff}" '.actions_caches[] | select(.ref != "refs/heads/main" and .last_accessed_at < $cutoff) | .id' | xargs -r -n 1 gh cache delete || true
